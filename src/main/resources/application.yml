spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    model:
      chat: none
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      embedding:
        options:
          model: text-embedding-3-small
    mcp:
      server:
        enabled: true
        stdio: true
        name: data360-mcp-server-oss
        version: 1.0.0
        type: SYNC
        instructions: >
          You have 3 tools: search, payload_examples, and execute.
          1. Use search to find the right tool family for your intent.
          2. Use payload_examples to see expected parameters for a specific tool.
          3. Use execute with the tool name and parameters to call the API.
          Always search first when unsure. Family summaries contain ordering hints.
        annotation-scanner:
          enabled: false

# d360-mcp-server auth config (AuthService reads data360.* properties)
data360:
  instance-url: ${DATA360_INSTANCE_URL:}
  access-token: ${DATA360_ACCESS_TOKEN:}
  api-version: ${DATA360_API_VERSION:66.0}
  login-url: ${DATA360_LOGIN_URL:https://login.salesforce.com}
  client-id: ${DATA360_CLIENT_ID:}
  client-secret: ${DATA360_CLIENT_SECRET:}
  auth-flow: ${DATA360_AUTH_FLOW:access_token}
  search-strategy: ${DATA360_SEARCH_STRATEGY:keyword}
